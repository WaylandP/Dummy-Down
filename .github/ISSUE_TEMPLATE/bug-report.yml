name: Something doesn't work
description: A page, a control or a key doesn't behave as it should.
title: 'Bug: '
labels: ['bug']
body:
  - type: input
    id: where
    attributes:
      label: Page address
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Browser, device and screen width
      description: For example Safari on iPhone, or Chrome at 1280×800. Mention a screen reader, zoom or reduced motion if you use one.
